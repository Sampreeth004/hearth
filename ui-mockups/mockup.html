<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hearth UI Mockups</title>
    <link rel="stylesheet" href="css/tailwind.css" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      /* Freeze animations so screenshots capture final state, not a frame mid-flight. */
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
      /* Keep the typing dots legible without their keyframes. */
      .typing-dot {
        opacity: 0.7;
      }
      .typing-dot:nth-child(3) {
        opacity: 1;
        background-color: #f59e0b;
      }
      ::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body class="bg-stone-50 text-stone-900 antialiased">
    <div id="app"></div>
    <script src="lucide.min.js"></script>
    <script src="mockup.js"></script>
  </body>
</html>
